name: Read pinned ARM64 CI image architecture

on:
  push:
    branches: [stabilization/1363-owned-ci-cleanup]

permissions:
  contents: read

concurrency:
  group: d15-owned-ci-readback
  cancel-in-progress: false

jobs:
  pinned-images:
    name: Read pinned local CI image architecture
    runs-on: [self-hosted, Linux, ARM64, macmini-arm64]
    timeout-minutes: 5
    steps:
      - name: Inspect only cached tags used by the verified disposable CI projects
        run: |
          exec python3 -u - <<'PYTHON'
          #!/usr/bin/env python3
          """READ ONLY: exact cancelled CI project inventory; no services started/stopped."""
          import json
          import os
          from pathlib import Path
          import subprocess
          import tomllib
          from urllib.parse import urlsplit


          def docker_environment():
              env = {key: value for key, value in os.environ.items()
                     if key in {'PATH', 'HOME', 'XDG_RUNTIME_DIR', 'TERM', 'DOCKER_HOST', 'DOCKER_CONTEXT'}}
              context = env.get('DOCKER_CONTEXT')
              endpoint = env.get('DOCKER_HOST')
              if context or not endpoint:
                  command = ['docker', 'context', 'inspect', '--format', '{{.Endpoints.docker.Host}}']
                  if context:
                      command.append(context)
                  endpoint = subprocess.run(command, env=env, text=True, capture_output=True,
                                            check=True, timeout=20).stdout.strip()
              address = urlsplit(endpoint)
              if (address.scheme != 'unix' or address.netloc or not address.path.startswith('/')
                      or address.query or address.fragment):
                  raise SystemExit('REFUSED: only a local Docker Unix socket may be inspected.')
              env.pop('DOCKER_CONTEXT', None)
              env['DOCKER_HOST'] = endpoint
              return env


          env = docker_environment()
          images = ['public.ecr.aws/supabase/postgrest:v14.10', 'public.ecr.aws/supabase/gotrue:v2.188.1', 'public.ecr.aws/supabase/kong:2.8.1', 'public.ecr.aws/supabase/postgres:17.6.1.106', 'public.ecr.aws/supabase/pg_prove:3.36']
          results = []
          for image in images:
              raw = subprocess.run(['docker', 'image', 'inspect', image], env=env, text=True,
                                   capture_output=True, check=True, timeout=20).stdout
              meta = json.loads(raw)[0]
              results.append({'tag': image, 'image_id': meta['Id'], 'os': meta['Os'],
                              'architecture': meta['Architecture'], 'variant': meta.get('Variant'),
                              'repo_digests': meta.get('RepoDigests')})
          print(json.dumps({'host_machine': os.uname().machine, 'docker_socket': env['DOCKER_HOST'],
                            'pinned_cached_image_metadata': results}, indent=2), flush=True)
          PYTHON
