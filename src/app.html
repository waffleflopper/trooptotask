<!doctype html>
<html lang="en">
	<head>
		<meta charset="utf-8" />
		<link rel="icon" href="%sveltekit.assets%/favicon.png" />
		<meta name="viewport" content="width=device-width, initial-scale=1" />
		<title>Troop to Task - Unit Staff Scheduling</title>
		<style>
			/* Critical CSS — inlined to avoid render-blocking on slow networks (NIPR).
			   Contains design tokens and base resets only.
			   Non-critical styles (components, utilities) load via app.css. */

			:root {
				/* Primary Colors - Brass */
				--color-primary: #b8943e;
				--color-primary-light: #d4b15a;
				--color-primary-dark: #96782f;
				--color-primary-hover: #d4b15a;
				--color-primary-rgb: 184, 148, 62;
				--color-primary-contrast: #0f0f0f;

				/* Secondary Colors - Teal */
				--color-secondary: #009688;
				--color-secondary-light: #26a69a;
				--color-secondary-dark: #00796b;

				/* Accent */
				--color-accent: #ff5722;

				/* Surface & Background */
				--color-bg: #fafafa;
				--color-surface: #ffffff;
				--color-surface-variant: #f5f5f5;
				--color-text: #212121;
				--color-text-secondary: #616161;
				--color-text-muted: #757575;
				--color-text-disabled: #9e9e9e;

				/* Borders & Dividers */
				--color-border: #e0e0e0;
				--color-border-dark: #bdbdbd;
				--color-divider: rgba(0, 0, 0, 0.12);

				/* Status Colors */
				--color-success: #4caf50;
				--color-success-light: #81c784;
				--color-warning: #ff9800;
				--color-warning-light: #ffb74d;
				--color-warning-rgb: 255, 152, 0;
				--color-error: #f44336;
				--color-error-light: #e57373;
				--color-error-rgb: 244, 67, 54;
				--color-destructive: var(--color-error);
				--color-destructive-rgb: var(--color-error-rgb);
				--color-info: #2196f3;
				--color-info-light: #64b5f6;

				/* Calendar specific */
				--color-weekend: #f5f5f5;
				--color-holiday: #fff8e1;
				--color-today-border: var(--color-primary);
				--color-today-bg: #f5f0e0;
				--color-onboarding-tint: rgba(184, 148, 62, 0.12);
				--color-primary-tint: rgba(var(--color-primary-rgb), var(--opacity-light));
				--color-warning-tint: rgba(var(--color-warning-rgb), var(--opacity-light));
				--color-error-tint: rgba(var(--color-error-rgb), var(--opacity-light));
				--color-destructive-tint: rgba(var(--color-destructive-rgb), var(--opacity-light));

				/* Spacing - 8px grid */
				--spacing-xs: 4px;
				--spacing-sm: 8px;
				--spacing-md: 16px;
				--spacing-lg: 24px;
				--spacing-xl: 32px;
				--spacing-2xl: 48px;

				/* Sizing */
				--cell-width: 36px;
				--cell-height: 32px;
				--personnel-column-width: 200px;
				--header-height: 56px;

				/* Typography */
				--font-family:
					'DM Sans', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
				--font-display: 'Instrument Serif', Georgia, 'Times New Roman', serif;
				--font-mono: 'DM Mono', 'Menlo', 'Consolas', monospace;
				--font-size-xs: 0.6875rem; /* 11px */
				--font-size-sm: 0.75rem; /* 12px */
				--font-size-base: 0.875rem; /* 14px */
				--font-size-lg: 1rem; /* 16px */
				--font-size-xl: 1.25rem; /* 20px */
				--font-size-2xl: 1.5rem; /* 24px */
				--font-size-3xl: 2rem; /* 32px */

				/* Font Weights */
				--font-weight-regular: 400;
				--font-weight-medium: 500;
				--font-weight-semibold: 600;
				--font-weight-bold: 700;

				/* Material Elevation Shadows */
				--shadow-0: none;
				--shadow-1: 0 1px 3px rgba(0, 0, 0, 0.12), 0 1px 2px rgba(0, 0, 0, 0.24);
				--shadow-2: 0 3px 6px rgba(0, 0, 0, 0.15), 0 2px 4px rgba(0, 0, 0, 0.12);
				--shadow-3: 0 10px 20px rgba(0, 0, 0, 0.15), 0 3px 6px rgba(0, 0, 0, 0.1);
				--shadow-4: 0 15px 25px rgba(0, 0, 0, 0.15), 0 5px 10px rgba(0, 0, 0, 0.05);
				--shadow-5: 0 20px 40px rgba(0, 0, 0, 0.2);

				/* Legacy shadow mapping */
				--shadow-sm: var(--shadow-1);
				--shadow-md: var(--shadow-2);
				--shadow-lg: var(--shadow-3);

				/* Border radius - more rounded */
				--radius-xs: 4px;
				--radius-sm: 6px;
				--radius-md: 8px;
				--radius-lg: 12px;
				--radius-xl: 16px;
				--radius-full: 9999px;

				/* Transitions */
				--transition-fast: 150ms cubic-bezier(0.4, 0, 0.2, 1);
				--transition-normal: 200ms cubic-bezier(0.4, 0, 0.2, 1);
				--transition-slow: 300ms cubic-bezier(0.4, 0, 0.2, 1);

				/* Z-index scale */
				--z-dropdown: 100;
				--z-sticky: 200;
				--z-modal-backdrop: 900;
				--z-modal: 1000;
				--z-tooltip: 1100;

				/* Chrome / App Shell */
				--color-chrome: #0f0f0f;
				--color-chrome-text: #f0ede6;
				--color-chrome-text-muted: #8a8780;
				--color-chrome-border: #2a2a2a;
				--color-chrome-active: var(--color-primary);

				/* Form field tokens */
				--field-bg: var(--color-surface);
				--field-border: var(--color-border);
				--field-border-focus: var(--color-primary);
				--field-label: var(--color-text-secondary);
				--field-error: var(--color-error);
				--field-help: var(--color-text-muted);
				--field-row-gap: var(--spacing-md);
				--field-stack-gap: var(--spacing-sm);
				--field-support-gap: var(--spacing-xs);

				/* Toolbar tokens */
				--toolbar-bg: var(--color-surface);
				--toolbar-border: var(--color-border);
				--section-card-padding: var(--spacing-xl);
				--section-card-gap: var(--spacing-md);

				/* Opacity scale */
				--opacity-subtle: 0.08;
				--opacity-light: 0.12;
				--opacity-medium: 0.15;
				--opacity-heavy: 0.45;

				/* Micro-spacing */
				--spacing-2xs: 2px;

				/* Skeleton loading */
				--skeleton-from: var(--color-surface-variant);
				--skeleton-to: var(--color-border);
				--skeleton-radius: var(--radius-md);
				--skeleton-duration: 1.5s;
			}

			[data-theme='dark'] {
				/* Primary - lighter brass for dark mode */
				--color-primary: #d4b15a;
				--color-primary-light: #e2c87a;
				--color-primary-dark: #b8943e;
				--color-primary-hover: #e2c87a;
				--color-primary-rgb: 212, 177, 90;
				--color-primary-contrast: #0f0f0f;

				/* Secondary */
				--color-secondary: #4db6ac;
				--color-secondary-light: #80cbc4;
				--color-secondary-dark: #26a69a;

				/* Accent */
				--color-accent: #ff8a65;

				/* Surface & Background - Material Dark */
				--color-bg: #121212;
				--color-surface: #1e1e1e;
				--color-surface-variant: #2d2d2d;
				--color-text: #ffffff;
				--color-text-secondary: #b3b3b3;
				--color-text-muted: #8c8c8c;
				--color-text-disabled: #4d4d4d;

				/* Borders */
				--color-border: #333333;
				--color-border-dark: #404040;
				--color-divider: rgba(255, 255, 255, 0.12);

				/* Calendar specific */
				--color-weekend: #1a1a1a;
				--color-holiday: #3d2c00;
				--color-today-bg: #2a2418;
				--color-onboarding-tint: rgba(184, 148, 62, 0.15);
				--color-primary-tint: rgba(var(--color-primary-rgb), var(--opacity-light));
				--color-warning-tint: rgba(var(--color-warning-rgb), var(--opacity-light));
				--color-error-tint: rgba(var(--color-error-rgb), var(--opacity-light));
				--color-destructive-tint: rgba(var(--color-destructive-rgb), var(--opacity-light));

				/* Adjusted shadows for dark mode */
				--shadow-1: 0 1px 3px rgba(0, 0, 0, 0.4), 0 1px 2px rgba(0, 0, 0, 0.48);
				--shadow-2: 0 3px 6px rgba(0, 0, 0, 0.45), 0 2px 4px rgba(0, 0, 0, 0.36);
				--shadow-3: 0 10px 20px rgba(0, 0, 0, 0.45), 0 3px 6px rgba(0, 0, 0, 0.3);
				--shadow-4: 0 15px 25px rgba(0, 0, 0, 0.45), 0 5px 10px rgba(0, 0, 0, 0.15);
				--shadow-5: 0 20px 40px rgba(0, 0, 0, 0.5);

				/* Chrome / App Shell — dark mode */
				--color-chrome: #0f0f0f;
				--color-chrome-text: #f0ede6;
				--color-chrome-text-muted: #8a8780;
				--color-chrome-border: #2a2a2a;
				--color-chrome-active: var(--color-primary);

				/* Form field tokens — dark mode */
				--field-bg: var(--color-surface);
				--field-border: var(--color-border);
				--field-border-focus: var(--color-primary);
				--field-label: var(--color-text-secondary);
				--field-error: var(--color-error);
				--field-help: var(--color-text-muted);

				/* Toolbar tokens — dark mode */
				--toolbar-bg: var(--color-surface);
				--toolbar-border: var(--color-border);
			}

			* {
				box-sizing: border-box;
				margin: 0;
				padding: 0;
			}

			html,
			body {
				height: 100%;
				font-family: var(--font-family);
				font-size: var(--font-size-base);
				font-weight: var(--font-weight-regular);
				color: var(--color-text);
				background-color: var(--color-bg);
				line-height: 1.5;
				-webkit-font-smoothing: antialiased;
				-moz-osx-font-smoothing: grayscale;
			}

			button {
				font-family: inherit;
				font-size: inherit;
				color: inherit;
				cursor: pointer;
				border: none;
				background: none;
			}

			input,
			select,
			textarea {
				font-family: inherit;
				font-size: inherit;
			}

			a {
				color: var(--color-primary);
				text-decoration: none;
				transition: color var(--transition-fast);
			}

			a:hover {
				color: var(--color-primary-light);
			}
		</style>
		%sveltekit.head%
	</head>
	<body data-sveltekit-preload-data="hover">
		<div style="display: contents">%sveltekit.body%</div>
	</body>
</html>
