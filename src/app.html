<!doctype html>
<html lang="en">
	<head>
		<meta charset="utf-8" />
		<link rel="icon" href="%sveltekit.assets%/favicon.png" />
		<meta name="viewport" content="width=device-width, initial-scale=1" />
		<meta name="color-scheme" content="light dark" />
		<title>Troop to Task - Unit Staff Scheduling</title>
		<script>
			try {
				const storedTheme = localStorage.getItem('theme');
				const theme =
					storedTheme === 'dark' || storedTheme === 'light'
						? storedTheme
						: window.matchMedia('(prefers-color-scheme: dark)').matches
							? 'dark'
							: 'light';

				document.documentElement.setAttribute('data-theme', theme);
			} catch {
				document.documentElement.setAttribute('data-theme', 'light');
			}
			try {
				if (localStorage.getItem('t2t:show-sub-groups') === 'false') {
					document.documentElement.setAttribute('data-sub-groups-hidden', '');
				}
			} catch {}
			try {
				// The Dashboard skeleton reserves the by-group strip's last height; stripHeightHint.ts owns the key and the cap.
				var orgPath = location.pathname.match(/^\/org\/([^/]+)/);
				var stripHeight =
					orgPath &&
					localStorage.getItem(
						't2t:dashboard-strip-height:' +
							orgPath[1] +
							(document.documentElement.hasAttribute('data-sub-groups-hidden') ? ':top-level' : ':sub-groups')
					);
				if (/^\d+$/.test(stripHeight) && stripHeight > 0 && stripHeight <= 10000) {
					document.documentElement.style.setProperty('--dashboard-strip-height', stripHeight + 'px');
				}
			} catch {}
		</script>
		%sveltekit.head%
	</head>
	<body data-sveltekit-preload-data="hover">
		<div style="display: contents">%sveltekit.body%</div>
	</body>
</html>
