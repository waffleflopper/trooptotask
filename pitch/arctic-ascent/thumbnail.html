<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<title>TroopToTask video thumbnail</title>
<style>
@font-face { font-family: 'Barlow Condensed'; font-weight: 800; src: url(assets/fonts/barlow-condensed-latin-800-normal.woff2); }
@font-face { font-family: 'IBM Plex Mono'; font-weight: 500; src: url(assets/fonts/ibm-plex-mono-latin-500-normal.woff2); }
* { box-sizing: border-box; margin: 0; padding: 0; }
html, body { background: #000; overflow: hidden; }
#thumb { position: relative; width: 1920px; height: 1080px; overflow: hidden; background: oklch(14.7% 0.004 49.25); }
canvas { position: absolute; inset: 0; }
#vignette { position: absolute; inset: 0; background: radial-gradient(ellipse at 30% 50%, transparent 50%, oklch(0% 0 0 / 0.55) 100%); }
/* Text stays left of center: LinkedIn draws its play button over the middle of the frame. */
#shot { position: absolute; left: 1010px; top: 110px; width: 1240px; height: 860px; border-radius: 10px; overflow: hidden;
  transform: rotate(-3deg); box-shadow: 0 40px 90px oklch(0% 0 0 / 0.7), 0 0 0 1px oklch(100% 0 0 / 0.12); background: oklch(98.5% 0.001 106.423) url(assets/live/dashboard.png) no-repeat; background-size: 1650px auto; background-position: -745px -285px; }
#word { position: absolute; left: 96px; top: 84px; font: 800 86px/1 'Barlow Condensed', sans-serif; letter-spacing: 0.01em; text-transform: uppercase; color: oklch(98.5% 0.001 106.423); }
#bar { position: absolute; left: 96px; top: 176px; width: 348px; height: 8px; background: oklch(66.6% 0.179 58.318); }
#hook { position: absolute; left: 88px; top: 262px; font: 800 300px/0.92 'Barlow Condensed', sans-serif; text-transform: uppercase; color: oklch(76.9% 0.188 70.08); }
#award { position: absolute; left: 96px; top: 864px; font: 800 72px/1 'Barlow Condensed', sans-serif; text-transform: uppercase; color: oklch(98.5% 0.001 106.423); }
#event { position: absolute; left: 96px; top: 950px; font: 500 28px/1 'IBM Plex Mono', monospace; letter-spacing: 0.08em; text-transform: uppercase; color: oklch(95.2% 0.006 95); }
</style>
</head>
<body>
<div id="thumb">
  <canvas id="snow" width="1920" height="1080"></canvas>
  <div id="vignette"></div>
  <div id="shot"></div>
  <div id="word">TroopToTask</div>
  <div id="bar"></div>
  <div id="hook">Who's<br>ready?</div>
  <div id="award">First runner-up</div>
  <div id="event">Arctic Ascent 2026 · 11th Airborne Division</div>
</div>
<script>
const ctx = document.getElementById('snow').getContext('2d');
const rnd = (i) => { const x = Math.sin(i * 127.1 + 311.7) * 43758.5453; return x - Math.floor(x); };
for (let i = 0; i < 160; i++) {
  const r = 0.8 + rnd(i + 77) * 2.6;
  ctx.fillStyle = `rgba(250,250,245,${0.25 + r / 5})`;
  ctx.beginPath(); ctx.arc(rnd(i) * 1920, rnd(i + 999) * 1080, r, 0, 6.283); ctx.fill();
}
</script>
</body>
</html>
