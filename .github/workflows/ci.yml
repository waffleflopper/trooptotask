name: CI

on:
  workflow_dispatch:

jobs:
  db-contracts:
    name: Supabase DB contracts
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - run: npm install -g npm@11.12.1

      - run: npm ci

      - uses: supabase/setup-cli@v2
        with:
          version: latest
          github-token: ${{ github.token }}

      - name: Start local Supabase
        run: supabase start

      - name: Run DB contracts
        run: npm run db:test

  unit:
    name: Type check & unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - run: npm install -g npm@11.12.1

      - run: npm ci

      - name: Format check
        run: npm run format:check

      - name: Lint
        run: npm run lint

      - name: Governance check
        run: npm run governance:check

      - name: Type check
        run: npm run check
        env:
          PUBLIC_SUPABASE_URL: http://localhost:54321
          PUBLIC_SUPABASE_ANON_KEY: dummy-key-for-type-check
          PUBLIC_BILLING_ENABLED: 'false'
          STRIPE_SECRET_KEY: sk_test_dummy
          STRIPE_WEBHOOK_SECRET: whsec_dummy
          STRIPE_TEAM_PRICE_ID: price_dummy_team
          STRIPE_UNIT_PRICE_ID: price_dummy_unit

      - name: Unit tests
        run: npm test
        env:
          PUBLIC_SUPABASE_URL: http://localhost:54321
          PUBLIC_SUPABASE_ANON_KEY: dummy-key-for-type-check
          PUBLIC_BILLING_ENABLED: 'false'
          STRIPE_SECRET_KEY: sk_test_dummy
          STRIPE_WEBHOOK_SECRET: whsec_dummy
          STRIPE_TEAM_PRICE_ID: price_dummy_team
          STRIPE_UNIT_PRICE_ID: price_dummy_unit
