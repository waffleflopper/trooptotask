name: CI

on:
  workflow_dispatch:

jobs:
  db-contracts:
    name: Supabase DB contracts
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          persist-credentials: false

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version-file: .nvmrc
          cache: npm

      - run: npm install -g npm@11.12.1

      - run: npm ci

      - uses: supabase/setup-cli@3c2f5e2ae34c34e428e8e206e2c4d21fa2d20fbf
        with:
          version: 2.101.0
          github-token: ${{ github.token }}

      - name: Start local Supabase
        run: supabase start

      - name: Run DB contracts
        run: npm run db:test

  unit:
    name: Type check & unit tests
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          persist-credentials: false
          fetch-depth: 0

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version-file: .nvmrc
          cache: npm

      - run: npm install -g npm@11.12.1

      - run: npm ci

      - name: Format check
        run: npm run format:check

      - name: Lint
        run: npm run lint

      - name: Governance check
        run: npm run governance:check

      - name: Type check
        run: npm run check
        env:
          PUBLIC_SUPABASE_URL: http://localhost:54321
          PUBLIC_SUPABASE_ANON_KEY: dummy-key-for-type-check

      - name: Unit tests
        run: npm test
        env:
          PUBLIC_SUPABASE_URL: http://localhost:54321
          PUBLIC_SUPABASE_ANON_KEY: dummy-key-for-type-check

      - name: Production build and SvelteKit import boundary
        run: npm run build
        env:
          PUBLIC_SUPABASE_URL: http://127.0.0.1:59999
          PUBLIC_SUPABASE_ANON_KEY: d02-synthetic-anon
          SUPABASE_SERVICE_ROLE_KEY: d02-synthetic-service
          ACCOUNT_SETUP_LINK_SECRET: d02-synthetic-setup
          APP_PUBLIC_ORIGIN: http://127.0.0.1:4173
